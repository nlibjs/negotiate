on:
  release:
    types: [published]
jobs:
  PublishNpm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - run: npm ci
      - run: npm run build
      - run: npm stage publish

  PublishJsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npx jsr publish
